<!--
  ============================================================================
  ANIMATED PRESENTATION · READ ME FIRST
  ============================================================================

  WHAT THIS IS
    The whole presentation is ONE HTML file: styles (CSS), slides (HTML),
    behaviour (JavaScript), images, videos and fonts are all inside. It needs
    no installation, no server and no internet. Slides are drawn on a fixed
    1600 x 900 "stage" that is scaled to fit any window.

  THREE WAYS TO CHANGE IT
    1. The editor, inside this file (press E, or the pencil button): add,
       remove and reorder slides, type texts on the slide, insert blocks,
       set animations and keyframes, place elements freely, and Save
       (Ctrl+S) straight into this HTML file (Chrome or Edge). See EDITOR.
    2. By hand, in any text editor: everything below is plain, commented
       HTML, CSS, JSON and JavaScript. Search for the banners (====).
    3. For developers: the same file is built from small parts in a src
       folder (python build.py; see the README). Optional: the editor and
       hand edits never need it.

  FILE MAP (top to bottom; search for the banner text)
    READ ME FIRST         this guide
    <style>               CSS sections 2-13 (see FILE LAYOUT)
    SLIDE 01 ... SLIDE NN one <section class="scene"> per slide, in order
    END OF THE SLIDES     new slides go above this line
    SLIDE TEMPLATES       ready-made slides (hidden; ?templates=1 shows them)
    CONTROLS BAR, SETTINGS PANEL
    THEMES                JSON: the colour themes
    INTERFACE TEXTS       JSON: every text of the interface (translate here)
    ANIMATIONS            JSON: animations with keyframes (data-animation)
    TEXT STYLES           JSON: your own text styles (editor, Style, + Save as style)
    CUSTOM CSS            your own CSS for the whole presentation (editor: Code tab); a
                          slide's own CSS sits in that slide: <style data-slide-css>
    CUSTOM JAVASCRIPT     your own script (type="text/plain"), run through hooks by JS
                          section 16b: show.onEnter / onStep / onLeave; a slide's own sits
                          in that slide: <script type="text/plain" data-slide-js>. ?safe=1: off
    BINARY DATA           fonts and the ASSETS block (images, videos as text).
                          Not meant to be read: skip it.
    MAIN SCRIPT           JavaScript sections 1-22 (see FILE LAYOUT)

  NOTES FOR AI TOOLS AND OTHER READERS
    - Read everything except the BINARY DATA part; it only holds encoded files.
    - Slides refer to images and videos by name: data-asset="img/name.jpg".
      Keep that attribute when you change a slide; the file itself is in ASSETS.
    - Texts of the interface are in INTERFACE TEXTS, not in the script.
    - Keep data-name of existing slides: scripts and styles refer to it.
    - Keep the JSON blocks valid JSON (double quotes, no comma after the last item).

  EDITOR (E)
    Left: the slides (drag to reorder, + Slide, Duplicate, Delete, Overview:
    all slides large, O). Middle:
    the chosen slide; click a text to type, click anything to select it.
    Middle: zoom with - / + under it, Ctrl+wheel, Ctrl+plus / minus, Ctrl+0;
    Space + drag (or the middle mouse button) moves a zoomed slide; Grid (G)
    and Snap switch the grid and snapping; a free element has a corner handle
    (Shift: keep proportions) and Line up (left ... bottom of the slide, or
    of the card it is placed in).
    A round handle turns it (Shift: 15° steps). Dragging snaps to equal gaps
    between neighbours too. Slide tab: "Use on every slide" for the
    transition or the background; ▶ Preview plays the slide's transition.
    Right: Element (style: size, colour (also picked from the screen), font,
    weight, italic, line height, capitals, alignment, rotation, front/back;
    a shape's fill and outline;
    how it appears, click effect, animation with keyframes, morph name, free
    placement, image or video file, image fit, numbers, chart rows, QR link,
    insert a block, text box or shape, copy / paste style, speed of
    appearing), Layers (every element as a tree: select, hide while
    editing, lock, find), Animations (everything that appears
    or moves on the slide, in playing order; drag a bar earlier or later;
    Play slide, Next click), Slide
    (title, name, time, transition, backup, notes, background, save as
    template) and Presentation (title, animation pace, logo, theme).
    Keys: Ctrl+C / X / V copy, cut and paste elements (also to another slide,
    and a screenshot or text from elsewhere), Ctrl+D duplicate, Tab next
    element, Alt+Up parent, Ctrl+Up / Down move, ? all keys. Shift+click
    selects several (align, spread, move, copy, duplicate together; let them
    appear one after another or per click), right-click opens a
    menu (on an empty spot: Add here, a text box or shape there), a
    double-click on an empty spot adds a text box there, Alt while dragging places without snapping, Ctrl while dragging
    leaves a copy, Ctrl+Alt+C / V copy and paste a style. The Presentation tab
    has find and replace over all slides.
    The editor is laid out as a desktop program: a menu bar (File, Edit,
    Insert, Format, Slide, Animate, Arrange, View, Help; Alt or F10), the slide
    list and the panel hide to a tab at the edge (the pointer opens them, a
    pin keeps them), a status bar, and a bar next to the selection with the
    most used actions (... there: the full right-click menu). F5 plays from
    here, Ctrl+M adds a slide, Ctrl+Shift+D duplicates it.
    Save (Ctrl+S) writes this file; the first time, Chrome or Edge asks you to
    pick this file. Save as new file, Export without editor (a copy for
    others: everything but the editor), New presentation, Play from here.
    Unsaved changes are kept as a draft in the browser. Undo: Ctrl+Z.
    Slides with their own script (the car, the flow, ...) keep their layout;
    their texts, numbers and images can change.

  HOW TO BUILD (developers only)
    Run  python build.py  next to the src folder. It joins the parts, puts
    the images and videos (img/) into the ASSETS block and embeds the fonts
    (fonts/), and writes Presentation.html (and index.html, the same
    without the <html> wrapper, for web publishing). A part that is not
    included stops the build, so a new file is never forgotten.

  LEAVING PARTS OUT (the editor, the presenter view)
    The file has three parts: the presentation itself (always), the presenter
    view (P: timer, notes, next slide, the audience window; CSS 9, JS 10b-12)
    and the editor (E; CSS 13, JS 17-20). The last two sit between marks:
    comments that say EDITOR-ONLY-START and EDITOR-ONLY-END, or
    PRESENTER-ONLY-START and PRESENTER-ONLY-END (a CSS/script comment around
    CSS and script, an HTML comment around HTML; search for them).
    Delete everything between a pair and the rest still works: the shared
    code asks hasEditor() / hasPresenterView() before it uses them, and calls
    the presenter view only through updatePresenterView() and friends (JS 10).
    What both use stays outside the marks: the time plan, still copies of a
    slide (CSS 9b), printing. Three ways to make such a copy:
      editor: File > Export without editor / without presenter view / slides only
      build:  python build.py --without editor | presenter | editor,presenter
      hand:   delete the marked blocks (and add data-no-editor / data-no-presenter
              to <div class="deck">, which hides the E / P buttons)
    New code for the editor or the presenter view goes inside its marks; code
    outside them never names something defined inside (the test suite
    "variants" makes the three copies and checks they run without errors).

  WHERE THINGS ARE IN THE SOURCE (src folder, developers only)
    deck.html             the outline: one include line per part
    slides/NN-name.html   one file per slide, in slide order
    parts/                the slide templates, the controls bar, the settings panel
    css/NN-*.css          the styles, numbered like the CSS sections below
    js/NN-*.js            the script, numbered like the JS sections below
    themes.json           the built-in colour themes
    interface-texts.json  every text of the interface (buttons, messages, help) in one table

  HOW TO PRESENT
    Next:  Right, Down, PageDown, Space, Enter, or a clicker (Logitech Spotlight)
    Back:  Left, Up, PageUp, Backspace
    P presenter view (second window for the audience) · Esc close presenter view
    F full screen · B or . black screen · Home / End first / last slide
    M animations on/off (only when Windows has animations turned off)
    S settings: theme, colours, time per slide, texts, export and import, print / PDF
    L spotlight · Z zoom (both follow the mouse; mouse wheel or + / − = size; Esc ends them)
    Presenter view drawers: C chapters · K key list (right edge) · G all slides · T texts (left edge)
    E editor (make and change slides, see EDITOR)
    Add ?templates=1 to the address to see the ready-made slide templates

  SPEAKER NOTES
    <aside class="speaker-notes"><p>...</p></aside> inside a slide. Only the
    presenter view and the printed handout show them. A line with
    data-note-step="2" lights up while step 2 of that slide is on screen.

  TIME PLAN (presenter view)
    Each slide has an estimated time. The presenter view shows whether you
    are ahead or behind ("≈ 1 min behind"), each chapter's time (teal: on time,
    rose: took longer), and in the bottom bar a white marker where the plan
    says you should be now. Next to the timer, a countdown shows the planned
    time left (the plan total minus the timer; rose "+00:40 over" after zero).

  CHECKS (presenter view, bottom of the side panel)
    Small dots: audience window connected and on this slide, audience full
    screen, projector connected, screen stays awake, battery, fonts, script
    errors. They only inform; nothing is ever blocked.

  BACKUP SLIDES
    data-backup on a slide's <section> makes it a backup slide: it comes after
    the last slide, Next never goes into it, and it is not in the time plan.
    Open one with the Slides drawer (G) or the chapter list.

  THEMES, TEXTS, EXPORT AND IMPORT (settings panel, also in the presenter view)
    Built-in colour themes are in src/themes.json (in the built file the block
    <script id="deckThemes">). Choices made in the settings panel are saved
    in this browser. Export / import: time plan (JSON), realized times per
    slide (Excel CSV or JSON, planned against actual), theme (JSON), texts (JSON).
    "Save a copy with these settings" downloads this presentation with the
    current theme, time plan and changed texts written into the file itself.

  FILE LAYOUT (search for the numbered banners)
    CSS   1 Fonts (in BINARY DATA) · 2 Design tokens · 3 Base and stage
          4 Slide transitions · 5 Shared text and components · 6 Shared animations
          7 Per-slide styles (one block per slide, in slide order)
          8 Controls bar · 9 Presenter view (PRESENTER-ONLY) · 9b Still copies
          10 Settings panel · 11 Reduced motion
          12 Print (slides and handout) · 13 Editor (EDITOR-ONLY)
    HTML  one <section class="scene"> per slide, in order; the SLIDE TEMPLATES;
          the controls bar; the settings panel; the THEMES and INTERFACE TEXTS blocks
    JS    1 Config · 2 Page elements and state · 3 Small helpers (and the safety net)
          4 Interface texts · 5 Animations and window sync
          6 Slide behaviours (one per animated slide)
          7 Slide components (break timer, QR code, video, chart, agenda, morph)
          8 Navigation · 9 Controls bar and input · 10 Time plan, timer, still copies
          PRESENTER-ONLY: 10b Presenter view · 11 Presenter view drawers · 12 Checks
          13 Settings panel
          14 Texts (the Texts drawer) · 15 Images (swap an image)
          16 Booth mode and live captions · 16b Custom code (the show API)
          EDITOR-ONLY: 17 Editor · 18 Editor canvas · 19 Editor tools · 20 layers,
          motion, commands, timeline, code (20-20e)
          21 Audience window
          22 Screen and window · 23 Start-up

  HOW A SLIDE WORKS
    <section class="scene" data-name="numbers" data-title="The numbers" data-estimate="50">
      data-name   id of the slide, used in the URL (#numbers) and by the script
      data-title  the chapter title in the bottom bar and the presenter view
      data-estimate  planned speaking time in seconds (the default; the
                  settings panel can change it per browser)
      data-steps  (optional) how many extra Next clicks the slide uses before it
                  moves on, e.g. the mode switcher on slide 5
      data-end-state  (optional) the slide has an "is-finished" look in CSS;
                  coming back with Back shows that end state at once
      data-backup (optional) a backup slide, see BACKUP SLIDES
    Elements with class "reveal" rise in one after another; style="--order:2"
    sets the place in that order (0 first).
    Elements with data-reveal-step="1", "2", ... appear one per Next click,
    with no script needed (do not put class "reveal" on the same element).

  STATE CLASSES (added and removed by the script, styled in CSS)
    is-active        the slide on screen
    is-visible       the slide's entrance animations run (stays on while it fades out)
    is-leaving       the slide is fading out
    is-playing       the slide's main animation runs (slide 3: the car drives)
    is-finished      the slide shows its end state
    is-returning     the slide was entered with Back
    is-fast-forward  slide 3 plays the rest of its animation 6 x faster

  RECIPES (in the editor, or by hand in this file)
    Change a text            editor: click it and type. By hand: edit the slide's HTML.
                             (Presenting: Texts drawer, T.)
    Add a slide              editor: + Slide, pick a layout. By hand: copy a <section
                             class="scene"> above END OF THE SLIDES, give it a new
                             data-name, data-title and data-estimate.
    Reorder, delete slides   editor: drag in the list, Delete. By hand: move the <section>.
    Add a backup slide       editor: Slide tab, Backup. By hand: data-backup on the <section>.
    Choose a transition      editor: Slide tab. By hand: data-transition="fade", "zoom" or
                             "none" on the <section>.
    How an item appears      editor: Element tab, Appears. By hand: class="reveal" with
                             style="--order:2" (rises in with the slide), or
                             data-reveal-step="1" (on click 1) with data-reveal-effect=
                             "pop", "highlight", "strike", "underline", "shake", "fade-out",
                             "leave" (disappears),
                             ... (click effects); data-focus: the rest dims on that click;
                             data-zoom-in="1.6": the slide zooms in on it on that click.
    Animation with keyframes editor: Element tab, Animation. By hand: data-animation="name"
                             and an entry in the ANIMATIONS block.
    Let an element glide     the same data-morph="name" on two slides (morph).
    Place an element freely  editor: Element tab, Place freely, then drag it.
                             By hand: class="is-free" style="--x:100px; --y:200px; --w:600px"
                             (--h: a height of its own, as shapes have; z-index: -1 puts it
                             behind the slide's content).
    Style an element         editor: Element tab, Style. By hand: plain inline CSS, e.g.
                             style="font-size: 125%; color: var(--color-accent);
                             text-align: center; rotate: -4deg; z-index: 3;
                             font-family: var(--font-mono); line-height: 1.3".
    Text box, shape          editor: Insert, Placed freely. By hand: copy a
                             <p class="text-box is-free"> or <div class="shape is-free"
                             data-shape="rect"> (a small SVG; colour = its `color`;
                             --shape-fill: 0 to 1 and --shape-stroke: 6px set its
                             fill and outline). Shapes: rect, circle, line, arrow,
                             triangle, star, callout.
    Quick animations         editor: Animations tab, top: In / Emphasis / Out (hover plays it).
    Text word by word        editor: Element tab, Text appears. By hand: data-split="word" or
                             "letter" or "line", style="--split-stagger: 60ms";
                             data-split-effect="fade" | "pop" | "drop" | "type" | "typewriter" (each part).
                             data-split-order="reverse" | "middle" | "edges" | "random" (which first).
    Keyframes, easing        editor: Animations tab: the ruler stops the slide at a moment;
                             drag a keyframe diamond; click between two for the easing window
                             (presets, springs, a curve to drag); ● Record makes keyframes
                             from moving or turning an element. By hand: "ease": "spring-bouncy"
                             or "cubic-bezier(.34, 1.56, .64, 1)" on a keyframe (ANIMATIONS block).
    Easing of appearing      editor: Element tab, Easing. By hand: animation-timing-function
                             (with the slide) or transition-timing-function (on a click),
                             e.g. var(--ease-elastic). Copy / Paste appearance copies
                             the way it appears, effect, speed and easing.
    Name an element          editor: double-click its row in the Layers tab. By hand:
                             data-editor-name="Logo box" (only the editor shows it).
    Speed of appearing       editor: Element tab, Speed. By hand: style="animation-duration:
                             1.2s" (rises in with the slide) or style="transition-duration:
                             1.2s" (appears on a click).
    Hide or lock (editing)   editor: Layers tab. By hand: data-editor-hidden or
                             data-editor-locked on the element (only the editor uses them).
    Slide background         editor: Slide tab, Background. By hand: style="background-color:
                             #203040" on the <section>, or data-asset-background="img/x.jpg"
                             (an ASSETS entry) with style="--background-dim: 0.4" to darken it.
    Logo                     editor: Presentation tab, Logo (or click the logo on the
                             canvas): replace, show, corner, size, large on the first and
                             last slide; Slide tab: No logo on this slide. By hand, on
                             <div class="logo">: data-corner="bottom-left", style="--logo-scale:
                             .5", data-large="off", hidden; data-hide-logo on a <section>.
    Add a text box or shape  editor: + Insert (top bar), or Element tab, Insert after this;
                             or double-click an empty spot.
    Text styles              editor: Style, Title / Heading / Body / Caption / Label / Quote /
                             Plain (or Aa in the bar, or Format): the whole look in one click.
    Timeline                 editor: the panel along the bottom (T): drag bars (start), their
                             ends (start / length) and the keyframes (Shift+click or a box:
                             several); Graph: the values as curves, drag a dot for a value.
    Group elements           editor: Shift+click elements placed freely, Ctrl+G (<div class="group
                             is-free" data-group>); Ctrl+Shift+G ungroups. Stagger: Element tab.
    Pace of one slide        editor: Animations tab, Pace (Calm, Brisk, All at once, or ms):
                             style="--reveal-stagger: 70ms" on the <section>. Order: as you
                             read it, or the other way round.
    Draw a motion path       editor: Animations tab, Path, Draw a path, then drag along the way
                             (Turn along: it turns with the way). It becomes keyframes.
    Morph pairs              editor: Element tab, Morph, Pair with the next slide: click the
                             element it glides into (both get the same data-morph).
    Find an action           editor: Ctrl+K (or /, or ⌕ Find): type a few letters; Enter.
                             Or the menu bar (Alt or F10).
    Share without the editor editor: File, Export without editor: <name>-presentation.html,
                             without sections 17-20c (the parts the source marks as editor-only).
    Move, resize, turn       editor: drag a freely placed element anywhere; 8 handles resize
                             (Ctrl: from the middle, Shift: proportions), the round one turns.
                             A block in the layout: drag its grip to reorder, or out of its box
                             to place it freely. Alt over another element: the distances.
    Save a slide as layout   editor: Slide tab, Save as template (it goes into the SLIDE
                             TEMPLATES block and shows in + Slide).
    Change an image          editor: select it, Replace the image. (Presenting: drop a
                             file on it in the presenter view.) By hand: add a line
                             "img/name.png": "data:image/png;base64,..." to the ASSETS block
                             (keep it valid JSON) and write <img data-asset="img/name.png" alt="...">.
                             Files no element uses are removed by the editor's next Save.
    Zoom into an image       editor: Element tab, Zoom and Focus. By hand on the <img>:
                             style="object-view-box: inset(0% 25% 50% 25%)" (what is left
                             out at the top, right, bottom, left) with object-position.
    Agenda, chart, QR code, video, break timer: editor + Slide or Insert, or copy them
                             from the SLIDE TEMPLATES.
    Change colours           Settings (S, or Theme in the editor), or the THEMES block.
    Change an interface text the INTERFACE TEXTS block (or the Texts drawer, Interface).
    Translate the interface  translate the values of INTERFACE TEXTS; keep {name} parts.
    Change a timing          script timings are all in CONFIG (JS section 1); CSS delays in
                             that slide's CSS block (section 7).
    Booth mode               Settings, or ?booth=20 in the address (20 s per slide).
    Add custom clicks        set data-steps, then add a behaviour in "6. SLIDE BEHAVIOURS"
                             with showStep(scene, step) and register it in slideBehaviours.
  ============================================================================
-->
