  <!-- ==================== SLIDE TEMPLATES ====================
       Ready-made slides to copy. They are NOT part of the presentation: a <template> is never shown.
       To see them, open the file with ?templates=1 at the end of the address
       (for example my-talk.html?templates=1), or click "Show slide templates" in the
       settings panel; they then appear after the last slide.
       To use one: copy its <section> into the deck above, give it a unique data-name,
       a data-title and a data-estimate, and change the texts.
       Click-reveal helper: give elements data-reveal-step="1", "2", ... and each Next click
       shows the next one; no script needed. Do not combine it with class "reveal" on the same element. -->
  <template id="slideTemplates">

    <!-- TEMPLATE · title slide -->
    <section class="scene" data-name="template-title" data-title="Template: title slide" data-estimate="30">
      <div class="content">
        <div class="eyebrow reveal" style="--order:0">Topic · date</div>
        <h1 class="template-title reveal" style="--order:1">Big title of the talk</h1>
        <p class="subtitle reveal" style="--order:2">One line that says what this is about.</p>
      </div>
      <aside class="speaker-notes"><p>Welcome the audience and say who you are.</p></aside>
    </section>

    <!-- TEMPLATE · section divider -->
    <section class="scene" data-name="template-section" data-title="Template: section divider" data-estimate="15">
      <div class="content">
        <div class="section-number reveal" style="--order:0">02</div>
        <h2 class="reveal" style="--order:1">Name of the next <span class="highlight">chapter</span></h2>
      </div>
    </section>

    <!-- TEMPLATE · title and bullet points (all on screen with the slide) -->
    <section class="scene" data-name="template-title-bullets" data-title="Template: title and bullet points" data-estimate="40">
      <div class="content">
        <h2 class="reveal" style="--order:0">Title of this slide</h2>
        <ul class="big-list reveal" style="--order:1">
          <li><span>First point</span></li>
          <li><span>Second point</span></li>
          <li><span>Third point</span></li>
        </ul>
      </div>
      <aside class="speaker-notes">
        <p>What to say on this slide, in a few short lines.</p>
      </aside>
    </section>

    <!-- TEMPLATE · bullet points, one per click (click-reveal helper) -->
    <section class="scene" data-name="template-bullets" data-title="Template: bullet points, one per click" data-estimate="40">
      <div class="content">
        <div class="eyebrow reveal" style="--order:0">Topic</div>
        <h2 class="reveal" style="--order:1">Three points, <span class="highlight">one per click</span></h2>
        <ul class="big-list">
          <li data-reveal-step="1"><span>First point<small>optional small note</small></span></li>
          <li data-reveal-step="2"><span>Second point</span></li>
          <li data-reveal-step="3"><span>Third point</span></li>
        </ul>
      </div>
      <!-- speaker notes: only the presenter view and the handout show them.
           A line with data-note-step="N" lights up when step N of the slide is on screen. -->
      <aside class="speaker-notes">
        <p>What to say on this slide, in a few short lines.</p>
        <p data-note-step="1">Said while the first point is on screen.</p>
        <p data-note-step="2">Said with the second point.</p>
        <p data-note-step="3">Said with the third point.</p>
      </aside>
    </section>

    <!-- TEMPLATE · cards with icons (use cards cols-4 or cols-5 for more) -->
    <section class="scene" data-name="template-cards" data-title="Template: cards" data-estimate="40">
      <div class="content">
        <div class="eyebrow reveal" style="--order:0">Topic</div>
        <h2 class="reveal" style="--order:1" data-morph="agenda-cards">Three things to know</h2>
        <div class="cards draw-icons">
          <div class="card reveal" style="--order:2"><div class="card-icon"><svg viewBox="0 0 24 24"><path pathLength="1" d="M5 12l5 5 9-10"/></svg></div><b>Card title</b><span>One short line of text</span></div>
          <div class="card reveal" style="--order:3"><div class="card-icon"><svg viewBox="0 0 24 24"><path pathLength="1" d="M12 3v18 M3 12h18"/></svg></div><b>Card title</b><span>One short line of text</span></div>
          <div class="card reveal" style="--order:4"><div class="card-icon"><svg viewBox="0 0 24 24"><path pathLength="1" d="M4 4h16v16H4z"/></svg></div><b>Card title</b><span>One short line of text</span></div>
        </div>
      </div>
    </section>

    <!-- TEMPLATE · numbers that count up (key-figure = amber and flashes) -->
    <section class="scene" data-name="template-stats" data-title="Template: numbers" data-estimate="40">
      <div class="content">
        <div class="eyebrow reveal" style="--order:0">Topic</div>
        <h2 class="reveal" style="--order:1" data-morph="agenda-stats">The numbers</h2>
        <div class="stats">
          <div class="stat key-figure reveal" style="--order:2"><div class="stat-value"><span class="count-up" data-to="42">42</span></div><div class="stat-label">what the number means</div></div>
          <div class="stat reveal" style="--order:3"><div class="stat-value"><span class="count-up" data-to="98.5" data-decimals="1">98.5</span>%</div><div class="stat-label">a percentage</div></div>
          <div class="stat reveal" style="--order:4"><div class="stat-value"><span class="count-up" data-to="3">3</span><small>days</small></div><div class="stat-label">a number with a unit</div></div>
        </div>
      </div>
    </section>

    <!-- TEMPLATE · image and text side by side
         Replace the placeholder with a div of class "image-frame" holding your image
         (put the file in the img folder; the README shows the exact code). -->
    <section class="scene" data-name="template-image" data-title="Template: image and text" data-estimate="45">
      <div class="content">
        <div class="eyebrow reveal" style="--order:0">Topic</div>
        <div class="two-columns">
          <div class="reveal" style="--order:1">
            <h2>Image with a story</h2>
            <p class="subtitle">Two or three lines that explain what the audience sees on the right.</p>
          </div>
          <div class="image-placeholder reveal" style="--order:2">Your image here</div>
        </div>
      </div>
    </section>

    <!-- TEMPLATE · big quote or statement -->
    <section class="scene" data-name="template-quote" data-title="Template: quote" data-estimate="20">
      <div class="content">
        <blockquote class="quote reveal" style="--order:0">One sentence the audience should remember.</blockquote>
        <div class="quote-source reveal" style="--order:2">Name, role</div>
      </div>
    </section>

    <!-- TEMPLATE · before and after -->
    <section class="scene" data-name="template-compare" data-title="Template: before and after" data-estimate="45">
      <div class="content">
        <div class="eyebrow reveal" style="--order:0">Topic</div>
        <h2 class="reveal" style="--order:1">Before and <span class="highlight">after</span></h2>
        <div class="compare-columns">
          <div class="compare-column before reveal" style="--order:2"><h3>Before</h3><ul><li>Manual step</li><li>Takes days</li></ul></div>
          <div class="compare-column after" data-reveal-step="1"><h3>After</h3><ul><li>Automated</li><li>Takes minutes</li></ul></div>
        </div>
      </div>
    </section>

    <!-- TEMPLATE · a question, its answer on a click (a quiz, a check for the class) -->
    <section class="scene" data-name="template-question" data-title="Template: question, answer on a click" data-estimate="40">
      <div class="content">
        <div class="eyebrow reveal" style="--order:0">Question</div>
        <h2 class="reveal" style="--order:1">What do you think happens next?</h2>
        <p class="subtitle" data-reveal-step="1"><b>Answer:</b> the answer appears on the next click.</p>
      </div>
    </section>

    <!-- TEMPLATE · process in steps, one per click -->
    <section class="scene" data-name="template-process" data-title="Template: steps, one per click" data-estimate="45">
      <div class="content">
        <div class="eyebrow reveal" style="--order:0">Topic</div>
        <h2 class="reveal" style="--order:1">How it works</h2>
        <ol class="process-steps">
          <li data-reveal-step="1"><b>Step one</b><span>What happens here</span></li>
          <li data-reveal-step="2"><b>Step two</b><span>What happens here</span></li>
          <li data-reveal-step="3"><b>Step three</b><span>What happens here</span></li>
          <li data-reveal-step="4"><b>Step four</b><span>What happens here</span></li>
        </ol>
      </div>
    </section>

    <!-- TEMPLATE · agenda you can click (PowerPoint calls this a summary zoom)
         A click on a chapter goes to the slide named in data-goto; Next at the end of that chapter
         (data-until, or the same slide) comes back here, and the chapter gets a tick.
         data-morph: the chapter title glides from its button to the title of the chapter slide,
         which has the same data-morph name. data-transition="zoom": this slide zooms in. -->
    <section class="scene" data-name="template-agenda" data-title="Template: clickable agenda" data-estimate="30" data-transition="zoom">
      <div class="content">
        <div class="eyebrow reveal" style="--order:0">Agenda · click a chapter</div>
        <div class="agenda">
          <button class="agenda-item reveal" style="--order:1" data-goto="template-cards"><span class="agenda-number">01</span><b data-morph="agenda-cards">Three things to know</b><small>cards with icons</small></button>
          <button class="agenda-item reveal" style="--order:2" data-goto="template-stats"><span class="agenda-number">02</span><b data-morph="agenda-stats">The numbers</b><small>numbers that count up</small></button>
          <button class="agenda-item reveal" style="--order:3" data-goto="template-chart" data-until="template-chart"><span class="agenda-number">03</span><b data-morph="agenda-chart">A chart</b><small>bars from a small table</small></button>
        </div>
      </div>
      <aside class="speaker-notes"><p>Click a chapter. Next at its end brings you back here.</p></aside>
    </section>

    <!-- TEMPLATE · click effects: data-reveal-effect next to data-reveal-step.
         grow, from-left, from-right, pop (springy), blur, flip: how the item appears;
         fade-out, highlight, strike, leave (disappears): the item is there from the start and its click changes it. -->
    <section class="scene" data-name="template-effects" data-title="Template: click effects" data-estimate="40">
      <div class="content">
        <div class="eyebrow reveal" style="--order:0">Topic</div>
        <h2 class="reveal" style="--order:1">One effect <span class="highlight">per click</span></h2>
        <ul class="big-list">
          <li data-reveal-step="1" data-reveal-effect="pop"><span>Pops in with a spring</span></li>
          <li data-reveal-step="2" data-reveal-effect="from-left"><span>Slides in from the left</span></li>
          <li data-reveal-step="3" data-reveal-effect="blur"><span>Comes into focus</span></li>
          <li data-reveal-step="4" data-reveal-effect="highlight"><span>Lights up in amber</span></li>
          <li data-reveal-step="5" data-reveal-effect="strike"><span>Gets crossed out</span></li>
          <li data-reveal-step="6" data-reveal-effect="fade-out"><span>Fades away</span></li>
          <li data-reveal-step="7" data-reveal-effect="leave"><span>Disappears</span></li>
        </ul>
      </div>
    </section>

    <!-- TEMPLATE · chart from a table. data-chart="bar" or "line"; data-unit is added after each value.
         Change the rows of the table (or the numbers in the Texts drawer); class="is-highlight" = amber. -->
    <section class="scene" data-name="template-chart" data-title="Template: chart" data-estimate="40">
      <div class="content">
        <div class="eyebrow reveal" style="--order:0">Topic</div>
        <h2 class="reveal" style="--order:1" data-morph="agenda-chart">A chart</h2>
        <figure class="chart reveal" style="--order:2" data-chart="bar" data-unit="%">
          <figcaption>What the numbers show, in one line</figcaption>
          <table>
            <tr><th>2023</th><td>34</td></tr>
            <tr><th>2024</th><td>51</td></tr>
            <tr><th>2025</th><td>68</td></tr>
            <tr class="is-highlight"><th>2026</th><td>92</td></tr>
          </table>
        </figure>
      </div>
    </section>

    <!-- TEMPLATE · morph: the same data-morph name on two slides in a row makes that element glide
         from its place on the first slide to its place on the second (try Next, then Back). -->
    <section class="scene" data-name="template-morph-a" data-title="Template: morph (before)" data-estimate="20">
      <div class="content">
        <h2 class="reveal" style="--order:0" data-morph="morph-title">Morph between slides</h2>
        <div class="morph-demo">
          <div class="card" data-morph="morph-card-1"><b>Small</b><span>moves and grows</span></div>
          <div class="card" data-morph="morph-card-2"><b>Second</b><span>moves to the left</span></div>
        </div>
      </div>
    </section>
    <section class="scene" data-name="template-morph-b" data-title="Template: morph (after)" data-estimate="20" data-transition="fade">
      <div class="content">
        <h2 data-morph="morph-title">Morph between slides</h2>
        <div class="morph-demo is-after">
          <div class="card" data-morph="morph-card-2"><b>Second</b><span>moves to the left</span></div>
          <div class="card" data-morph="morph-card-1"><b>Small</b><span>moves and grows</span></div>
        </div>
      </div>
    </section>

    <!-- TEMPLATE · video. Put a short .webm or .mp4 in img/ (it is embedded in the file, so keep it small).
         Without data-play-step it plays when the slide comes on; data-play-step="1" plays it on the first click.
         muted: no sound; remove it for sound (the audience window plays the sound, the presenter view stays quiet). -->
    <section class="scene" data-name="template-video" data-title="Template: video" data-estimate="40">
      <div class="content">
        <div class="eyebrow reveal" style="--order:0">Topic</div>
        <h2 class="reveal" style="--order:1">A short <span class="highlight">screen recording</span></h2>
        <div class="video-frame reveal" style="--order:2"><video class="slide-video" src="img/sample-video.webm" muted playsinline preload="auto" data-play-step="1"></video></div>
      </div>
      <aside class="speaker-notes"><p>The first click plays the video.</p></aside>
    </section>

    <!-- TEMPLATE · QR code. Put the link in data-qr (up to 213 characters); it is drawn offline.
         Change the link in the Texts drawer too ("QR code link"). -->
    <section class="scene" data-name="template-qr" data-title="Template: QR code" data-estimate="20">
      <div class="content">
        <div class="eyebrow reveal" style="--order:0">Topic</div>
        <div class="qr-block">
          <div class="qr-code reveal" style="--order:1" data-qr="https://example.com/feedback" data-edit-attr="data-qr"></div>
          <div class="reveal" style="--order:2">
            <h2>Scan for the <span class="highlight">slides</span></h2>
            <p class="subtitle">Or type the link: <span class="qr-link">example.com/feedback</span></p>
          </div>
        </div>
      </div>
    </section>

    <!-- TEMPLATE · break timer. data-minutes on the <time> is the length of the break (also in the Texts drawer).
         "Back at" shows the end time; the countdown runs in both windows. -->
    <section class="scene" data-name="template-break" data-title="Template: break" data-estimate="0" data-transition="fade">
      <div class="content">
        <div class="break-timer">
          <div class="eyebrow reveal" style="--order:0">Short break</div>
          <div class="break-until reveal" style="--order:1">Back at <time class="break-time" data-minutes="10" data-edit-attr="data-minutes">--:--</time></div>
          <div class="break-countdown reveal" style="--order:2" data-no-edit>10:00</div>
        </div>
      </div>
    </section>

    <!-- TEMPLATE · backup slide: data-backup puts it after the end of the talk. Next never goes there;
         open it with the Slides drawer (G) or the chapter list, Back returns to where you were. -->
    <section class="scene" data-name="template-backup" data-title="Template: backup slide" data-estimate="0" data-backup>
      <div class="content">
        <div class="eyebrow reveal" style="--order:0">Backup</div>
        <h2 class="reveal" style="--order:1">Details for <span class="highlight">questions</span></h2>
        <p class="subtitle reveal" style="--order:2">Only shown when someone asks.</p>
      </div>
      <aside class="speaker-notes"><p>Open this slide from the Slides drawer (G) when a question needs it.</p></aside>
    </section>
  </template>
